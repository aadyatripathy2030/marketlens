<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — ChartGauge</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: #0e1014; color: #e6eaf2; font: 400 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .box { max-width: 420px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: #8b94a7; margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; color: #fff; background: #4c9eff;
    border: none; border-radius: 10px; padding: 10px 20px; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>ChartGauge needs a connection — prices and indicators are computed from live market data, and showing you a saved copy would mean showing you numbers that are no longer true.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
