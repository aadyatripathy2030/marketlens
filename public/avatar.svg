<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ChartGauge avatar: a rising candlestick chart under the gauge dome.
       Full-bleed square because platforms crop avatars to a circle; content
       stays within 205px of centre. Bodies are deliberately wide with large
       gaps — at the 24px a comment avatar renders at, the body is the only
       part that survives, and narrow candles merge into one dark mass. -->
  <rect width="512" height="512" fill="#4c9eff"/>
  <g transform="translate(0,12)">
    <path d="M91 330A165 165 0 0 1 421 330" fill="none" stroke="#8fc2ff" stroke-width="38" stroke-linecap="round"/>
    <path d="M91 330A165 165 0 0 1 335.5 185.4" fill="none" stroke="#0f1620" stroke-width="38" stroke-linecap="round"/>
    <rect x="177.5" y="272" width="9" height="64" rx="4" fill="#0f1620"/>
    <rect x="161" y="280" width="42" height="50" rx="6" fill="#0f1620"/>
    <rect x="251.5" y="248" width="9" height="78" rx="4" fill="#0f1620"/>
    <rect x="235" y="256" width="42" height="64" rx="6" fill="#0f1620"/>
    <rect x="325.5" y="232" width="9" height="88" rx="4" fill="#0f1620"/>
    <rect x="309" y="240" width="42" height="74" rx="6" fill="#0f1620"/>
  </g>
</svg>
