<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ChartGauge avatar: a rising candlestick chart, nothing above it.
       Full-bleed square because platforms crop avatars to a circle; content
       reaches 181px of a 256px crop radius. Bodies are wide and wicks are
       thick because at the 24px a comment avatar renders at, thin strokes
       disappear and only the solid shapes survive. -->
  <rect width="512" height="512" fill="#4c9eff"/>
  <g transform="translate(0,-8)">
    <rect x="140" y="224" width="16" height="162" rx="8" fill="#0f1620"/>
    <rect x="114" y="250" width="68" height="110" rx="10" fill="#0f1620"/>
    <rect x="248" y="184" width="16" height="172" rx="8" fill="#0f1620"/>
    <rect x="222" y="210" width="68" height="120" rx="10" fill="#0f1620"/>
    <rect x="356" y="142" width="16" height="184" rx="8" fill="#0f1620"/>
    <rect x="330" y="168" width="68" height="132" rx="10" fill="#0f1620"/>
  </g>
</svg>
