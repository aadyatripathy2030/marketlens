<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ChartGauge avatar on white. The trend line runs through the candle body
       midpoints, so it joins the candles rather than cutting across them, and
       shows in the gaps. A faint ring gives the disc an edge, which a white
       avatar otherwise loses completely against a light feed. Candle colours
       are deeper than the app's own — #3ddc84 is 1.78:1 on white and vanishes.
       Content reaches 181px of a 256px crop radius. -->
  <rect width="512" height="512" fill="#ffffff"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#d5dee9" stroke-width="10"/>
  <g transform="translate(0,-8)">
    <path d="M92 323 420 216" stroke="#2b7fd4" stroke-width="14" stroke-linecap="round" fill="none"/>
    <rect x="140" y="224" width="16" height="162" rx="8" fill="#e23c34"/>
    <rect x="114" y="250" width="68" height="110" rx="10" fill="#e23c34"/>
    <rect x="248" y="184" width="16" height="172" rx="8" fill="#10a35a"/>
    <rect x="222" y="210" width="68" height="120" rx="10" fill="#10a35a"/>
    <rect x="356" y="142" width="16" height="184" rx="8" fill="#10a35a"/>
    <rect x="330" y="168" width="68" height="132" rx="10" fill="#10a35a"/>
  </g>
</svg>
