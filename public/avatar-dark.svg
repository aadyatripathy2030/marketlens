<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Avatar: full-bleed square, cropped to a circle by every platform. The
       mark fills ~80% of the crop so it still reads at 24px, and the needle
       stops short of the arc so the two never merge at small sizes. -->
  <rect width="512" height="512" fill="#1a212b"/>
  <path d="M88.0 314.0A168 168 0 0 1 424.0 314.0" fill="none" stroke="#333d4d" stroke-width="60" stroke-linecap="round"/>
  <path d="M88.0 314.0A168 168 0 0 1 336.9 166.8" fill="none" stroke="#4c9eff" stroke-width="60" stroke-linecap="round"/>
  <path d="M256 314 312.8 210.6" fill="none" stroke="#f2f5f8" stroke-width="30" stroke-linecap="round"/>
  <circle cx="256" cy="314" r="31" fill="#f2f5f8"/>
  <circle cx="256" cy="314" r="10" fill="#1a212b"/>
</svg>
