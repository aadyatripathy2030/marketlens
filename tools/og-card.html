<!-- Source for public/og.png, the 1200x630 social share card.

     Regenerate after editing (from the repo root):

       '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' \
         --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
         --window-size=1200,630 --screenshot=public/og.png tools/og-card.html

     Then re-scrape the URL in each platform's debugger, or the old image
     stays cached for days.

     The chart on the right is a drawing, not a real reading: it has no
     prices on it, only where the stop and targets sit relative to entry.
     Brand: the two-candle mark (red #ff5f56, green #3ddc84) on #1c1d1f, Inter. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: "Inter"; src: url("../public/fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1c1d1f; --card: #26272a; --text: #f4f4f5; --muted: #b4b7bd;
    --border: #34363a; --accent: #6ea2ff; --good: #3ddc84; --bad: #ff5f56;
  }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--bg); color: var(--text); font-family: "Inter", sans-serif;
    display: grid; grid-template-columns: 1fr 400px; gap: 56px; padding: 64px 72px;
    -webkit-font-smoothing: antialiased;
  }
  .left { display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 650; letter-spacing: -.4px; }
  h1 { font-size: 60px; line-height: 1.08; font-weight: 650; letter-spacing: -1.6px; margin-bottom: 22px; }
  .sub { font-size: 24px; line-height: 1.45; color: var(--muted); max-width: 32ch; }
  .foot { display: flex; align-items: baseline; gap: 22px; font-size: 20px; color: var(--muted); }
  .url { font-size: 24px; font-weight: 600; color: var(--accent); }
  .card { align-self: center; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 26px 28px; }
  .call { font-size: 18px; color: var(--muted); margin-bottom: 14px; }
  .lv { display: grid; grid-template-columns: auto 1fr; row-gap: 10px; column-gap: 18px; margin-top: 16px; font-size: 18px; }
  .lv dt { color: var(--muted); }
  .lv dd { text-align: right; font-weight: 600; }
  .g { color: var(--good); } .r { color: var(--bad); }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <svg width="48" height="48" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1c1d1f"/><rect x="19.75" y="15" width="4.5" height="34" rx="1" fill="#ff5f56"/><rect x="14" y="23" width="16" height="18" rx="2" fill="#ff5f56"/><rect x="39.75" y="11" width="4.5" height="40" rx="1" fill="#3ddc84"/><rect x="34" y="17" width="16" height="28" rx="2" fill="#3ddc84"/></svg>
      ChartGauge
    </div>
    <div>
      <h1>Every chart comes with a stop, a target and the reason.</h1>
      <p class="sub">In plain English, for any US stock or crypto pair. A plan before you risk money.</p>
    </div>
    <div class="foot"><span class="url">chartgauge.com</span><span>Educational, not financial advice</span></div>
  </div>
  <div class="card">
    <div class="call">Example plan</div>
    <svg width="344" height="200" viewBox="0 0 364 200" aria-hidden="true">
      <line x1="0" y1="14" x2="364" y2="14" stroke="#3ddc84" stroke-width="1.5" stroke-dasharray="6 5"/>
      <line x1="0" y1="64" x2="364" y2="64" stroke="#3ddc84" stroke-width="1.5" stroke-dasharray="6 5" opacity=".7"/>
      <line x1="0" y1="114" x2="364" y2="114" stroke="#b4b7bd" stroke-width="1" opacity=".5"/>
      <line x1="0" y1="164" x2="364" y2="164" stroke="#ff5f56" stroke-width="1.5" stroke-dasharray="6 5"/>
      <polyline fill="none" stroke="#6ea2ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
        points="0,156 28,148 52,152 80,140 104,146 132,138 156,146 182,124 206,132 232,112 258,124 284,104 310,118 336,108 364,114"/>
      <circle cx="364" cy="114" r="5" fill="#6ea2ff"/>
    </svg>
    <dl class="lv">
      <dt>Second target</dt><dd class="g">2R</dd>
      <dt>First target</dt><dd class="g">1R</dd>
      <dt>Stop</dt><dd class="r">1.5 × ATR</dd>
    </dl>
  </div>
</body>
</html>
