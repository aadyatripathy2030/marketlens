# Render Blueprint — deploy ChartGauge as a free web service + Postgres.
#
# The names below MUST match the live services exactly, as spelled in the Render
# dashboard's SERVICE NAME column (verified 2026-09-28):
#
#   marketlens-dgit      web service, Node, Oregon — serves chartgauge.com
#   marketlens-db-dgit   PostgreSQL 18, Oregon     — holds every account
#
# They previously read "marketlens" and "marketlens-db", which match nothing.
# A blueprint that names a service Render does not have does not adopt the live
# one — it CREATES another. That is where the duplicate (marketlens-i6ru) came
# from, and why it had to be suspended and deleted.
#
# So: do not change these to anything else, and in particular do not shorten
# them back. The "-dgit" is part of the name, not a suffix on the URL.
# Renaming them on a sync creates a fresh service without the chartgauge.com
# domain binding, and a fresh, empty database.
#
# In Render: New → Blueprint (or open your existing blueprint → Manual Sync).
# Keys are sync:false, so Render prompts for them — never commit keys.
databases:
  - name: marketlens-db-dgit     # free Postgres; Render provisions + wires it automatically
    plan: free

services:
  - type: web
    name: marketlens-dgit
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL         # auto-filled from the database above — persistent accounts
        fromDatabase:
          name: marketlens-db-dgit
          property: connectionString
      - key: STOCK_API_KEY        # Twelve Data key (twelvedata.com, free tier) — real prices
        sync: false
      - key: ANTHROPIC_API_KEY    # Anthropic key (console.anthropic.com) — AI text + image analysis
        sync: false
      - key: FMP_API_KEY          # Financial Modeling Prep (financialmodelingprep.com) — fundamentals
        sync: false
      - key: FINNHUB_API_KEY      # Finnhub (finnhub.io) — company news
        sync: false
      - key: GA_MEASUREMENT_ID    # Google Analytics 4 Measurement ID (G-XXXXXXX); public, optional
        sync: false
      - key: ADMIN_EMAILS         # comma-separated emails granted the Admin dashboard
        sync: false
      - key: STRIPE_SECRET_KEY    # Stripe secret key (sk_...) — subscriptions
        sync: false
      - key: STRIPE_PRICE_WEEKLY  # Stripe Price ID (price_...) for the weekly Pro plan
        sync: false
      - key: STRIPE_PRICE_MONTHLY # Stripe Price ID (price_...) for the monthly Pro plan
        sync: false
      - key: STRIPE_PRICE_YEARLY  # Stripe Price ID (price_...) for the yearly Pro plan
        sync: false
      - key: STRIPE_WEBHOOK_SECRET # Stripe webhook signing secret (whsec_...)
        sync: false
      - key: ANTHROPIC_MODEL      # optional; a cheaper model (e.g. claude-haiku-4-5) lowers cost
        value: claude-opus-4-8
      - key: GOOGLE_CLIENT_ID     # "Sign in with Google" — dormant (silently) until both are set
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SITE_VERIFICATION  # Search Console token; omit once DNS-verified
        sync: false
      - key: PRO_EMAILS           # comma-separated emails given complimentary Pro
        sync: false
      - key: CONTACT_EMAIL        # shown on /contact; defaults to chartgauge@gmail.com
        sync: false
      - key: FREE_UNTIL           # everything is free until this instant, then the normal split
        value: "2026-10-18T00:00:00Z"

# Read by the app but deliberately NOT declared here, because each has a working
# default and listing them would prompt for a value on every blueprint sync:
#   AI_FREE_DAILY, ACCURACY_HORIZON, ANTHROPIC_MODEL_FREE, DATA_CREDITS_PER_MIN,
#   DATA_USER_RESERVE, FINNHUB_PER_MIN, FREE_ALERT_MAX, FREE_WATCH_MAX,
#   MOVERS_SYMBOLS, RANKED_REFRESH_MS, RANKED_SYMBOLS, STRIPE_PRICE_ID (legacy).
# PORT is set by Render itself — never declare it.
