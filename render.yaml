# Render Blueprint — deploy MarketLens as a free web service + Postgres.
# In Render: New → Blueprint (or open your existing blueprint → Manual Sync).
# The two API keys are sync:false, so Render prompts for them — never commit keys.
databases:
  - name: marketlens-db          # free Postgres; Render provisions + wires it automatically
    plan: free

services:
  - type: web
    name: marketlens
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL         # auto-filled from the database above — persistent accounts
        fromDatabase:
          name: marketlens-db
          property: connectionString
      - key: STOCK_API_KEY        # Twelve Data key (twelvedata.com, free tier) — real prices
        sync: false
      - key: ANTHROPIC_API_KEY    # Anthropic key (console.anthropic.com) — AI text + image analysis
        sync: false
      - key: FMP_API_KEY          # Financial Modeling Prep (financialmodelingprep.com) — fundamentals
        sync: false
      - key: FINNHUB_API_KEY      # Finnhub (finnhub.io) — company news
        sync: false
      - key: GA_MEASUREMENT_ID    # Google Analytics 4 Measurement ID (G-XXXXXXX); public, optional
        sync: false
      - key: ADMIN_EMAILS         # comma-separated emails granted the Admin dashboard
        sync: false
      - key: STRIPE_SECRET_KEY    # Stripe secret key (sk_...) — subscriptions
        sync: false
      - key: STRIPE_PRICE_ID      # Stripe recurring Price ID (price_...) for the Pro plan
        sync: false
      - key: STRIPE_WEBHOOK_SECRET # Stripe webhook signing secret (whsec_...)
        sync: false
      - key: ANTHROPIC_MODEL      # optional; a cheaper model (e.g. claude-haiku-4-5) lowers cost
        value: claude-opus-4-8
